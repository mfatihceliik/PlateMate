spring.application.name=platemate

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/PlateMate
spring.datasource.username=postgres
spring.datasource.password=123456

# 2. Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# 3. PostGre driver
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. JWT Settings
# IMPORTANT: Production'da bu secret en az 256-bit (32 karakter) ve güvenli olmalı!
# Bu değeri environment variable ile yönetmeyi düşün.
jwt.secret=PlateMateSecretKeyForJWTTokenGeneration2026!
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

# 5. Socket.io Settings
socket.host=0.0.0.0
socket.port=9092

# 6. Moderation Settings
moderation.accepted-responsibility-legacy-fallback=true
moderation.comment-report-threshold=3
moderation.hide-plate-on-removal-request=true

# 7. Compliance retention settings
platemate.moderation-retention-days=365
platemate.compliance-retention.cron=0 45 3 * * *

# 8. Swagger UI
springdoc.swagger-ui.urlsPrimaryName=client
