services:
  app:
    image: ghcr.io/mfatihceliik/platemate-backend:latest
    container_name: platemate-backend
    ports:
      - "8080:8080" # Spring Boot varsayılan portu
      - "9092:9092" # Socket.io portu
    environment:
      # Veritabanı bağlantı bilgilerini eziyoruz (localhost yerine db konteynerine bağlanması için)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/PlateMate
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-local-dev-password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET:-platemate-local-dev-jwt-secret-key-2026-minimum-32-chars}
    volumes:
      - ./serviceAccountKey.json:/app/secrets/serviceAccountKey.json:ro
    depends_on:
      db:
        condition: service_healthy # db konteyneri tamamen hazır olmadan app ayağa kalkmaz

  db:
    # PostGIS destekli PostgreSQL kullanıyoruz, build.gradle'da spatial kütüphanesi var
    image: postgis/postgis:15-3.3
    container_name: platemate-db
    environment:
      - POSTGRES_DB=PlateMate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PlateMate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
